<div class="min-h-screen flex bg-brand-50">
  <!-- Sidebar (AURA dark theme) -->
  <app-sidebar [open]="sidebarOpen()" />

  <!-- Mobile overlay backdrop -->
  @if (sidebarOpen()) {
    <div
      class="fixed inset-0 bg-ink-900/40 z-30 lg:hidden"
      (click)="sidebarOpen.set(false)"
      aria-hidden="true"
    ></div>
  }

  <!-- Contenido -->
  <div class="flex-1 min-w-0 flex flex-col">
    <!-- Mobile header bar with hamburger -->
    <header class="lg:hidden flex items-center gap-3 px-4 py-3 bg-[#0b1739] border-b border-[#13224f]">
      <button
        type="button"
        (click)="toggleSidebar()"
        aria-label="Abrir menu"
        class="text-white p-2 -ml-2 hover:bg-[#13224f] rounded-lg transition"
      >
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="w-5 h-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
        </svg>
      </button>
      <a routerLink="/resumen" class="flex items-center gap-2 text-white font-bold">
        <div class="bg-white text-[#0b1739] font-bold text-sm rounded-md w-7 h-7 flex items-center justify-center">H</div>
        <span class="tracking-wide">AURA</span>
      </a>
    </header>

    <!-- Navbar -->
    <app-navbar />

    <!-- Breadcrumb + Title header -->
    <div class="flex items-center justify-between px-8 py-4 border-b border-line bg-brand-50">
      <div>
        <p class="text-[11px] font-semibold tracking-wider text-ink-300 uppercase mb-1">
          Portal estudiantil / {{ header().breadcrumb }}
        </p>
        <h1 class="text-xl font-bold text-ink-900 tracking-tight">{{ header().title }}</h1>
      </div>

      @if (auth.usuario(); as usuario) {
        <div class="flex items-center gap-3">
          <div
            class="w-7 h-7 rounded-full bg-brand-100 text-brand-800 flex items-center justify-center text-[11px] font-bold"
          >
            {{ usuario.iniciales }}
          </div>
          <span class="text-sm font-medium text-ink-900">{{ usuario.nombre }}</span>
          <button
            type="button"
            (click)="onLogout()"
            aria-label="Cerrar sesion"
            class="text-ink-500 hover:text-ink-900"
          >
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="1.8" class="w-4 h-4">
              <path stroke-linecap="round" stroke-linejoin="round" d="M14 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-2M9 12h11m0 0-3-3m3 3-3 3" />
            </svg>
          </button>
        </div>
      }
    </div>

    <!-- Page content -->
    <main class="p-8">
      <router-outlet />
    </main>
  </div>
</div>
