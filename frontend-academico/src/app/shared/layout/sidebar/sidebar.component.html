<aside
  class="w-60 shrink-0 bg-[#0b1739] flex flex-col justify-between text-white p-5
         fixed inset-y-0 left-0 z-40 overflow-y-auto transition-transform duration-300 ease-in-out
         lg:relative lg:h-screen lg:translate-x-0 lg:transition-none"
  [class.translate-x-0]="open()"
  [class.-translate-x-full]="!open()"
  [attr.aria-hidden]="!open() ? 'true' : null"
>
  <div>
    <!-- Logo -->
    <div class="flex items-center gap-2.5 mb-7">
      <div class="bg-white text-[#0b1739] font-bold text-lg rounded-md w-9 h-9 flex items-center justify-center shrink-0" title="AURA · Portal estudiantil">H</div>
      <h1 class="text-xl font-bold tracking-wide">AURA</h1>
    </div>

    <!-- Navegacion -->
    <div class="mb-6">
      <p class="text-xs font-semibold text-[#8faef4]/60 mb-3 tracking-wider uppercase">Navegacion</p>
      <nav class="space-y-1">
        <a
          routerLink="/resumen"
          routerLinkActive="bg-[#13224f] text-[#8faef4] border-l-2 border-[#0d44b5]"
          [routerLinkActiveOptions]="{ exact: true }"
          title="Inicio: resumen de tu dia"
          class="flex items-center gap-3 py-2.5 px-3.5 rounded-lg font-medium text-white hover:bg-[#13224f] transition"
        >
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="w-5 h-5 shrink-0">
            <path stroke-linecap="round" stroke-linejoin="round" d="m2.5 19.5 10-11.5M5.5 19.5h14M5.5 19.5V8.5m14 0v11" />
          </svg>
          Inicio
        </a>
        <a
          routerLink="/horario"
          routerLinkActive="bg-[#13224f] text-[#8faef4] border-l-2 border-[#0d44b5]"
          title="Horario"
          class="flex items-center gap-3 py-2.5 px-3.5 rounded-lg font-medium text-white hover:bg-[#13224f] transition"
        >
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="w-5 h-5 shrink-0">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
            <line x1="16" y1="2" x2="16" y2="6" />
            <line x1="8" y1="2" x2="8" y2="6" />
            <line x1="3" y1="10" x2="21" y2="10" />
          </svg>
          Horario
        </a>
        <a
          routerLink="/notas"
          routerLinkActive="bg-[#13224f] text-[#8faef4] border-l-2 border-[#0d44b5]"
          title="Calificaciones"
          class="flex items-center gap-3 py-2.5 px-3.5 rounded-lg font-medium text-white hover:bg-[#13224f] transition"
        >
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="w-5 h-5 shrink-0">
            <circle cx="12" cy="8" r="6" />
            <path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11" />
          </svg>
          Calificaciones
        </a>
        <button
          type="button"
          disabled
          title="Perfil · disponible proximamente"
          class="w-full flex items-center gap-3 py-2.5 px-3.5 rounded-lg font-medium text-white opacity-50 cursor-not-allowed transition text-left"
        >
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="w-5 h-5 shrink-0">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
          </svg>
          Perfil
        </button>
      </nav>
    </div>

    <!-- Administracion (solo docentes y admins) -->
    @if (auth.puedeGestionar()) {
      <div class="mb-6">
        <p class="text-xs font-semibold text-[#8faef4]/60 mb-3 tracking-wider uppercase">Administracion</p>
        <nav class="space-y-1">
          <a
            routerLink="/admin/cursos"
            routerLinkActive="bg-[#13224f] text-[#8faef4] border-l-2 border-[#0d44b5]"
            title="Gestion de cursos"
            class="flex items-center gap-3 py-2.5 px-3.5 rounded-lg font-medium text-white hover:bg-[#13224f] transition"
          >
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="w-5 h-5 shrink-0">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 0 0 6 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 0 1 6 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 0 1 6-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0 0 18 18a8.967 8.967 0 0 0-6 2.292m0-14.25v14.25" />
            </svg>
            Cursos
          </a>
          @if (auth.esAdmin()) {
            <a
              routerLink="/admin/usuarios"
              routerLinkActive="bg-[#13224f] text-[#8faef4] border-l-2 border-[#0d44b5]"
              title="Gestion de usuarios"
              class="flex items-center gap-3 py-2.5 px-3.5 rounded-lg font-medium text-white hover:bg-[#13224f] transition"
            >
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="w-5 h-5 shrink-0">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 0 0 2.625.372 9.337 9.337 0 0 0 4.121-.952 4.125 4.125 0 0 0-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 0 1 8.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0 1 11.964-3.07M12 6.375a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0Zm8.25 2.25a2.625 2.625 0 1 1-5.25 0 2.625 2.625 0 0 1 5.25 0Z" />
              </svg>
              Usuarios
            </a>
          }
        </nav>
      </div>
    }

    <!-- Cuenta -->
    <div>
      <p class="text-xs font-semibold text-[#8faef4]/60 mb-3 tracking-wider uppercase">Cuenta</p>
      <nav class="space-y-1">
        <button
          type="button"
          disabled
          title="Ajustes · disponible proximamente"
          class="w-full flex items-center gap-3 py-2.5 px-3.5 rounded-lg text-white opacity-50 cursor-not-allowed transition text-left"
        >
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="w-5 h-5 shrink-0">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 0 1 0 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 0 1 0-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28Z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
          </svg>
          Ajustes
        </button>
        <button
          type="button"
          (click)="onLogout()"
          title="Cerrar sesion y volver al login"
          class="w-full flex items-center gap-3 py-2.5 px-3.5 rounded-lg text-white hover:bg-[#13224f] transition text-left"
        >
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="w-5 h-5 shrink-0">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15M12 9l-3 3m0 0 3 3m-3-3h12.75" />
          </svg>
          Cerrar sesion
        </button>
      </nav>
    </div>
  </div>

  <!-- Usuario Footer -->
  @if (auth.usuario(); as usuario) {
    <div class="bg-[#13224f] rounded-xl p-3 flex items-center gap-2.5 mt-4" [title]="usuario.nombre + ' · ' + usuario.correo">
      <div
        class="w-9 h-9 rounded-full flex items-center justify-center font-bold text-sm shrink-0 bg-[#8faef4] text-[#0b1739]"
      >
        {{ usuario.iniciales }}
      </div>
      <div class="min-w-0">
        <p class="font-semibold text-sm truncate">{{ usuario.nombre }}</p>
        <p class="text-xs text-[#8faef4]/60 capitalize">{{ usuario.rol }}</p>
      </div>
    </div>
  }
</aside>
